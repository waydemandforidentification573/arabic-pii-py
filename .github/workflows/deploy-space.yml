name: Deploy demo to Hugging Face Space

# On every merge to main that touches the demo, upload demo/ to the HF
# Space; Hugging Face then rebuilds the Docker image automatically.
#
# One-time setup:
#   1. Create the Space once (UI or CLI), SDK = Docker:
#        huggingface-cli repo create aajil-labs-sa/apii-demo \
#          --repo-type space --space_sdk docker
#   2. Add a repo secret HF_TOKEN = a Hugging Face *write* token
#      (https://huggingface.co/settings/tokens) with access to the org.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch:

# Target Space — change if you rename it.
env:
  HF_SPACE: aajil-labs-sa/apii-demo

concurrency:
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hugging Face Hub CLI
        run: pip install --upgrade "huggingface_hub>=0.24"
      - name: Ensure the Space exists (Docker SDK)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "from huggingface_hub import create_repo; create_repo('$HF_SPACE', repo_type='space', space_sdk='docker', exist_ok=True)"
      - name: Upload demo/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # `huggingface-cli` is a deprecated no-op in hub >=1.0 — use `hf`.
          hf upload \
            --repo-type space \
            "$HF_SPACE" ./demo . \
            --commit-message "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
